<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Dimension line (bold, full width) -->
<line x1="6" y1="20" x2="58" y2="20" stroke="#7AB0CC" stroke-width="3" stroke-linecap="round"/>
<line x1="6" y1="12" x2="6" y2="28" stroke="#7AB0CC" stroke-width="3" stroke-linecap="round"/>
<line x1="58" y1="12" x2="58" y2="28" stroke="#7AB0CC" stroke-width="3" stroke-linecap="round"/>
<!-- Orange dimension value box (center) -->
<rect x="22" y="12" width="20" height="16" rx="3" fill="#EAA030"/>
<rect x="25" y="16" width="14" height="3" rx="1.5" fill="white"/>
<rect x="28" y="22" width="8" height="2" rx="1" fill="white" opacity="0.7"/>
<!-- Text annotation tag (floating) -->
<rect x="6" y="34" width="52" height="24" rx="4" fill="#1A2838"/>
<rect x="6" y="34" width="52" height="24" rx="4" fill="none" stroke="#2E4258" stroke-width="1.5"/>
<!-- Tag pointer -->
<polygon points="14,34 20,34 17,28" fill="#1A2838"/>
<!-- Text lines inside tag -->
<rect x="10" y="40" width="38" height="3" rx="1.5" fill="#7AB0CC" opacity="0.7"/>
<rect x="10" y="47" width="26" height="3" rx="1.5" fill="#4A6880"/>
</svg>
