<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Blueprint/CAD paper -->
<rect x="4" y="4" width="48" height="56" rx="4" fill="#1E2A3A"/>
<!-- Folded corner -->
<polygon points="40,4 52,4 52,16" fill="#C2440C"/>
<polygon points="40,4 52,16 40,16" fill="#A83300" opacity="0.7"/>
<!-- CAD drawing content (building plan lines) -->
<rect x="10" y="20" width="36" height="28" rx="1" fill="none" stroke="#5A7290" stroke-width="1.2"/>
<rect x="14" y="24" width="10" height="20" rx="1" fill="none" stroke="#7A93A8" stroke-width="1.5"/>
<rect x="28" y="30" width="14" height="14" rx="1" fill="none" stroke="#7A93A8" stroke-width="1.5"/>
<line x1="14" y1="34" x2="28" y2="34" stroke="#5A7290" stroke-width="1"/>
<line x1="24" y1="24" x2="24" y2="44" stroke="#5A7290" stroke-width="1"/>
<!-- DWG label band at bottom -->
<rect x="4" y="52" width="48" height="8" rx="3" fill="#C2440C"/>
<!-- Right panel (layer list) -->
<rect x="54" y="4" width="8" height="56" rx="3" fill="#253344"/>
<rect x="55" y="8" width="6" height="2" rx="1" fill="#C2440C"/>
<rect x="55" y="13" width="6" height="2" rx="1" fill="#5A7290"/>
<rect x="55" y="18" width="6" height="2" rx="1" fill="#5A7290"/>
<rect x="55" y="23" width="6" height="2" rx="1" fill="#5A7290"/>
</svg>
