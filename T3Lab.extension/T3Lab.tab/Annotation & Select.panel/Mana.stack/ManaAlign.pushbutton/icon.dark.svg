<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Bold orange alignment guide (left edge) -->
<line x1="10" y1="4" x2="10" y2="60" stroke="#EAA030" stroke-width="5" stroke-linecap="round"/>
<!-- Elements snapping to the guide (3 bars, aligned left) -->
<rect x="10" y="8" width="44" height="12" rx="3" fill="#7AB0CC"/>
<rect x="10" y="26" width="30" height="12" rx="3" fill="#5A90B8"/>
<rect x="10" y="44" width="38" height="12" rx="3" fill="#4A7898"/>
<!-- Alignment snap indicators (small orange ticks at left edge) -->
<line x1="6" y1="14" x2="14" y2="14" stroke="#EAA030" stroke-width="2.5" stroke-linecap="round"/>
<line x1="6" y1="32" x2="14" y2="32" stroke="#EAA030" stroke-width="2.5" stroke-linecap="round"/>
<line x1="6" y1="50" x2="14" y2="50" stroke="#EAA030" stroke-width="2.5" stroke-linecap="round"/>
<!-- White text hint lines inside blocks -->
<rect x="16" y="12" width="18" height="2" rx="1" fill="#1A2838" opacity="0.5"/>
<rect x="16" y="30" width="12" height="2" rx="1" fill="#1A2838" opacity="0.4"/>
<rect x="16" y="48" width="16" height="2" rx="1" fill="#1A2838" opacity="0.4"/>
</svg>
