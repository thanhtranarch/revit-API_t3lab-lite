<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Building silhouette (dark) -->
<rect x="6" y="20" width="44" height="42" rx="3" fill="#182A3E"/>
<!-- Building windows -->
<rect x="11" y="26" width="8" height="8" rx="1" fill="#EEF2F7" opacity="0.6"/>
<rect x="23" y="26" width="8" height="8" rx="1" fill="#EEF2F7" opacity="0.6"/>
<rect x="35" y="26" width="8" height="8" rx="1" fill="#EEF2F7" opacity="0.6"/>
<rect x="11" y="38" width="8" height="8" rx="1" fill="#EEF2F7" opacity="0.4"/>
<rect x="23" y="38" width="8" height="8" rx="1" fill="#EEF2F7" opacity="0.4"/>
<rect x="35" y="38" width="8" height="8" rx="1" fill="#EEF2F7" opacity="0.4"/>
<!-- Building roof peak -->
<polygon points="6,20 28,4 50,20" fill="#28445E"/>
<circle cx="28" cy="10" r="2" fill="#D07818"/>
<!-- Orange magnifier overlay (right side, prominent) -->
<circle cx="46" cy="18" r="14" fill="#D07818"/>
<circle cx="46" cy="18" r="10" fill="none" stroke="white" stroke-width="3"/>
<line x1="53" y1="25" x2="60" y2="32" stroke="white" stroke-width="4" stroke-linecap="round"/>
<!-- Check inside magnifier -->
<polyline points="41,18 45,22 52,13" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
