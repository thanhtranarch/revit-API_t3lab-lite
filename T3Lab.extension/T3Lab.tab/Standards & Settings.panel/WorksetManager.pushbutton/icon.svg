<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Workset layers (stacked cards) -->
<rect x="4" y="36" width="56" height="14" rx="4" fill="#334155"/>
<rect x="4" y="24" width="56" height="14" rx="4" fill="#253344"/>
<rect x="4" y="12" width="56" height="14" rx="4" fill="#1E2A3A"/>
<!-- Orange accent on top layer (active workset) -->
<rect x="4" y="12" width="14" height="14" rx="4" fill="#C2440C"/>
<!-- Content dots on each layer -->
<circle cx="26" cy="19" r="2" fill="#EEF2F7" opacity="0.7"/>
<circle cx="34" cy="19" r="2" fill="#EEF2F7" opacity="0.5"/>
<circle cx="42" cy="19" r="2" fill="#EEF2F7" opacity="0.35"/>
<circle cx="50" cy="19" r="2" fill="#EEF2F7" opacity="0.2"/>
<rect x="10" y="29" width="40" height="3" rx="1.5" fill="#5A7290" opacity="0.6"/>
<rect x="10" y="41" width="28" height="3" rx="1.5" fill="#7A93A8" opacity="0.4"/>
<!-- User dots (3 users on active workset) -->
<circle cx="8" cy="16" r="3.5" fill="white" opacity="0.9"/>
<circle cx="13" cy="20" r="1.5" fill="white" opacity="0.7"/>
<!-- Lock icon on middle layer -->
<rect x="48" y="27" width="8" height="6" rx="1" fill="#7A93A8" opacity="0.5"/>
<path d="M49.5 27 Q49.5 23 52 23 Q54.5 23 54.5 27" fill="none" stroke="#7A93A8" stroke-width="1.5" opacity="0.5"/>
<!-- Bottom layer - shared lines -->
<rect x="10" y="53" width="44" height="3" rx="1.5" fill="#7A93A8" opacity="0.3"/>
</svg>
