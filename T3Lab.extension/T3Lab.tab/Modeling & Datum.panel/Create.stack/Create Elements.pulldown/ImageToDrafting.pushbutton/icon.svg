<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Photo frame (left) -->
<rect x="2" y="8" width="26" height="20" rx="3" fill="#28445E"/>
<rect x="4" y="10" width="22" height="16" rx="2" fill="#5A7290" opacity="0.5"/>
<!-- Mountain/landscape in photo -->
<polygon points="6,24 12,14 18,20 22,16 26,24" fill="#7A93A8"/>
<circle cx="8" cy="14" r="2.5" fill="#D07818"/>
<!-- Bold orange transform arrow (center) -->
<path d="M30 18 L34 18" stroke="#D07818" stroke-width="4" stroke-linecap="round"/>
<polygon points="31,13 38,18 31,23" fill="#D07818"/>
<!-- Drafting view (right, clean lines) -->
<rect x="38" y="6" width="24" height="28" rx="3" fill="#182A3E"/>
<line x1="42" y1="12" x2="58" y2="12" stroke="#7A93A8" stroke-width="1.5"/>
<line x1="42" y1="17" x2="54" y2="17" stroke="#5A7290" stroke-width="1.5"/>
<line x1="42" y1="22" x2="58" y2="22" stroke="#7A93A8" stroke-width="1.5"/>
<line x1="42" y1="27" x2="50" y2="27" stroke="#5A7290" stroke-width="1"/>
<!-- Orange active highlight on drafting line -->
<line x1="42" y1="17" x2="54" y2="17" stroke="#D07818" stroke-width="2"/>
<!-- Bottom info bar -->
<rect x="2" y="40" width="60" height="14" rx="4" fill="#182A3E"/>
<rect x="6" y="44" width="22" height="3" rx="1.5" fill="#5A7290"/>
<rect x="34" y="44" width="22" height="3" rx="1.5" fill="#D07818" opacity="0.7"/>
</svg>
