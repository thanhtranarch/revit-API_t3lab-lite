<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- 3 grid lines (vertical) with bubbles -->
<line x1="14" y1="14" x2="14" y2="54" stroke="#1E2A3A" stroke-width="2"/>
<line x1="32" y1="14" x2="32" y2="54" stroke="#C2440C" stroke-width="2.5"/>
<line x1="50" y1="14" x2="50" y2="54" stroke="#1E2A3A" stroke-width="2"/>
<!-- Grid bubbles at top -->
<circle cx="14" cy="9" r="8" fill="#EEF2F7" stroke="#1E2A3A" stroke-width="2"/>
<circle cx="32" cy="9" r="8" fill="#C2440C"/>
<circle cx="50" cy="9" r="8" fill="#EEF2F7" stroke="#1E2A3A" stroke-width="2"/>
<!-- Inner letters/numbers in circles -->
<rect x="11" y="7" width="6" height="2.5" rx="1.2" fill="#5A7290"/>
<rect x="29" y="7" width="6" height="2.5" rx="1.2" fill="white"/>
<rect x="47" y="7" width="6" height="2.5" rx="1.2" fill="#5A7290"/>
<!-- 2 level lines (horizontal) with tails -->
<line x1="4" y1="30" x2="60" y2="30" stroke="#334155" stroke-width="2"/>
<line x1="4" y1="44" x2="60" y2="44" stroke="#334155" stroke-width="2"/>
<!-- Level arrows (left side) -->
<polygon points="4,28 4,32 8,30" fill="#334155"/>
<polygon points="4,42 4,46 8,44" fill="#334155"/>
<!-- Orange active level indicator -->
<rect x="54" y="27" width="8" height="6" rx="2" fill="#C2440C"/>
</svg>
