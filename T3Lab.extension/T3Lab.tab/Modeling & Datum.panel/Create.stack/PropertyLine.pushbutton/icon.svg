<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Ground/grass base -->
<rect x="2" y="48" width="60" height="14" rx="3" fill="#28445E"/>
<!-- Property boundary polygon -->
<polyline points="10,48 10,24 26,10 46,14 54,30 54,48" fill="rgba(194,68,12,0.1)" stroke="#D07818" stroke-width="3" stroke-linejoin="round"/>
<line x1="10" y1="48" x2="54" y2="48" stroke="#D07818" stroke-width="3"/>
<!-- Corner markers (orange circles) -->
<circle cx="10" cy="24" r="4" fill="#D07818"/>
<circle cx="26" cy="10" r="4" fill="#D07818"/>
<circle cx="46" cy="14" r="4" fill="#D07818"/>
<circle cx="54" cy="30" r="4" fill="#D07818"/>
<!-- Survey stake at top-right corner -->
<line x1="46" y1="14" x2="46" y2="2" stroke="#182A3E" stroke-width="3" stroke-linecap="round"/>
<line x1="40" y1="6" x2="52" y2="6" stroke="#182A3E" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="46" cy="2" r="2" fill="#D07818"/>
</svg>
