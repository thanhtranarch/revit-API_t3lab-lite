title: "Property\nLine"
tooltip: "Draw property lines anywhere in the world — just type the address."
description: |
  Type any address on earth and pick the matching boundary
  Uses OpenStreetMap worldwide (no API key) and LightBox cadastral parcels for US addresses
  Places a closed property line loop at the project base point, survey point or world origin
  Optionally writes the site latitude/longitude into the project location
author: "Tran Tien Thanh"
version: "2.0.0"
