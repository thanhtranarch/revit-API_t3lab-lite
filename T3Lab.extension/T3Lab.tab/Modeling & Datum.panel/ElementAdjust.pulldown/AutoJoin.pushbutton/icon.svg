<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Horizontal wall -->
<rect x="4" y="24" width="56" height="16" rx="3" fill="#182A3E"/>
<!-- Vertical wall crossing through -->
<rect x="24" y="4" width="16" height="56" rx="3" fill="#28445E"/>
<!-- Orange join highlight at intersection -->
<rect x="24" y="24" width="16" height="16" rx="2" fill="#D07818"/>
<!-- Join seam lines -->
<line x1="24" y1="32" x2="40" y2="32" stroke="#B86010" stroke-width="1.5"/>
<line x1="32" y1="24" x2="32" y2="40" stroke="#B86010" stroke-width="1.5"/>
<!-- White corner geometry-cleanup dots -->
<circle cx="24" cy="24" r="3" fill="white" opacity="0.8"/>
<circle cx="40" cy="24" r="3" fill="white" opacity="0.8"/>
<circle cx="24" cy="40" r="3" fill="white" opacity="0.8"/>
<circle cx="40" cy="40" r="3" fill="white" opacity="0.8"/>
</svg>
