<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Top wall half -->
<rect x="6" y="6" width="52" height="20" rx="4" fill="#7AB0CC"/>
<rect x="10" y="10" width="30" height="3" rx="1.5" fill="#1A2838" opacity="0.3"/>
<rect x="10" y="16" width="22" height="3" rx="1.5" fill="#1A2838" opacity="0.2"/>
<!-- Bold orange cut line -->
<line x1="2" y1="32" x2="62" y2="32" stroke="#EAA030" stroke-width="5" stroke-linecap="round"/>
<!-- Scissors icon on cut line -->
<circle cx="44" cy="28" r="5" fill="#EAA030"/>
<circle cx="52" cy="28" r="5" fill="#EAA030"/>
<line x1="40" y1="32" x2="56" y2="44" stroke="#EAA030" stroke-width="3" stroke-linecap="round"/>
<line x1="56" y1="32" x2="40" y2="44" stroke="#EAA030" stroke-width="3" stroke-linecap="round"/>
<!-- Bottom wall half (gap separating the two) -->
<rect x="6" y="38" width="52" height="20" rx="4" fill="#5A90B8"/>
<rect x="10" y="42" width="26" height="3" rx="1.5" fill="#1A2838" opacity="0.3"/>
<rect x="10" y="48" width="18" height="3" rx="1.5" fill="#1A2838" opacity="0.2"/>
</svg>
