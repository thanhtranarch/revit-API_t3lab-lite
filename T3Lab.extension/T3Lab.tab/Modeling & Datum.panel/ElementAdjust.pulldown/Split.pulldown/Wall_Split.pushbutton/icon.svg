<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Left wall section -->
<rect x="4" y="8" width="24" height="50" rx="3" fill="#1E2A3A"/>
<rect x="8" y="14" width="16" height="3" rx="1.5" fill="#EEF2F7" opacity="0.4"/>
<rect x="8" y="20" width="12" height="3" rx="1.5" fill="#EEF2F7" opacity="0.3"/>
<rect x="8" y="26" width="14" height="3" rx="1.5" fill="#EEF2F7" opacity="0.2"/>
<!-- Right wall section -->
<rect x="36" y="8" width="24" height="50" rx="3" fill="#253344"/>
<rect x="40" y="14" width="16" height="3" rx="1.5" fill="#EEF2F7" opacity="0.4"/>
<rect x="40" y="20" width="12" height="3" rx="1.5" fill="#EEF2F7" opacity="0.3"/>
<rect x="40" y="26" width="14" height="3" rx="1.5" fill="#EEF2F7" opacity="0.2"/>
<!-- Bold orange vertical split line (center) -->
