<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Left floor slab -->
<rect x="4" y="20" width="24" height="10" rx="3" fill="#7AB0CC"/>
<!-- Floor hatch lines (left) -->
<line x1="8" y1="20" x2="4" y2="24" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<line x1="13" y1="20" x2="6" y2="27" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<line x1="18" y1="20" x2="11" y2="27" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<line x1="23" y1="20" x2="16" y2="27" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<line x1="28" y1="20" x2="21" y2="27" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<!-- Right floor slab -->
<rect x="36" y="20" width="24" height="10" rx="3" fill="#5A90B8"/>
<!-- Floor hatch lines (right) -->
<line x1="40" y1="20" x2="36" y2="24" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<line x1="46" y1="20" x2="39" y2="27" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<line x1="52" y1="20" x2="45" y2="27" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<line x1="58" y1="20" x2="51" y2="27" stroke="#1A2838" stroke-width="0.8" opacity="0.3"/>
<!-- Orange vertical split (bold, center) -->
<line x1="32" y1="14" x2="32" y2="36" stroke="#EAA030" stroke-width="5" stroke-linecap="round"/>
<!-- Split arrows (up/down from gap) -->
<polygon points="28,16 32,10 36,16" fill="#EAA030"/>
<polygon points="28,34 32,40 36,34" fill="#EAA030"/>
<!-- Ground line -->
<rect x="4" y="38" width="56" height="8" rx="3" fill="#4A7898"/>
</svg>
