title: "IFC-SG\nSubtype"
tooltip: Batch-assign IFC Export Class and Predefined Type from the official IFC+SG Industry Mapping.
description: |
  IFC-SG entity subtype assigner for CORENET X compliance:
  - Loads the official IFC+SG Industry Mapping Excel (COP Edition 3)
  - Batch-assigns IFC Export Class and Predefined Type to Revit elements
  - Supports all element categories defined in the Singapore mapping standard
  - Run after model completion to prepare for IFC-SG export

author: Dang Quoc Truong
