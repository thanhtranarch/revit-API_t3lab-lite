<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Schedule sheet background -->
<rect x="4" y="2" width="56" height="60" rx="5" fill="#EEF2F7"/>
<!-- Header row (dark, full width) -->
