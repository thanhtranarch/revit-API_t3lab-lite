<rect x="4" y="45" width="56" height="8" rx="0" fill="#F8FAFC"/>
<rect x="8" y="48" width="20" height="2" rx="1" fill="#B0BEC5"/>
<rect x="31" y="48" width="10" height="2" rx="1" fill="#B0BEC5"/>
<rect x="49" y="48" width="8" height="2" rx="1" fill="#182A3E" opacity="0.35"/>
