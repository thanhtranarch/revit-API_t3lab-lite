<line x1="46" y1="18" x2="46" y2="62" stroke="#E2E8F0" stroke-width="1"/>
<!-- Row 2 (orange active) -->
<rect x="4" y="27" width="56" height="8" rx="0" fill="#FFF7F5"/>
<rect x="2" y="27" width="4" height="8" fill="#D07818"/>
<rect x="8" y="30" width="18" height="2" rx="1" fill="#D07818"/>
<rect x="31" y="30" width="12" height="2" rx="1" fill="#D07818" opacity="0.6"/>
<rect x="49" y="30" width="6" height="2" rx="1" fill="#D07818" opacity="0.8"/>
<line x1="4" y1="35" x2="60" y2="35" stroke="#E2E8F0" stroke-width="1"/>
<!-- Row 3 -->
<rect x="4" y="36" width="56" height="8" rx="0" fill="white"/>
<rect x="8" y="39" width="14" height="2" rx="1" fill="#B0BEC5"/>
