<line x1="28" y1="2" x2="28" y2="16" stroke="#3A5C7A" stroke-width="1.5"/>
<line x1="46" y1="2" x2="46" y2="16" stroke="#3A5C7A" stroke-width="1.5"/>
<!-- Column header labels -->
<rect x="8" y="7" width="14" height="2.5" rx="1.2" fill="#7A93A8"/>
<rect x="31" y="7" width="10" height="2.5" rx="1.2" fill="#7A93A8"/>
<rect x="49" y="7" width="8" height="2.5" rx="1.2" fill="#D07818"/>
<!-- Data rows -->
<rect x="4" y="18" width="56" height="8" rx="0" fill="white"/>
<rect x="8" y="21" width="16" height="2" rx="1" fill="#B0BEC5"/>
<rect x="31" y="21" width="10" height="2" rx="1" fill="#B0BEC5"/>
<rect x="49" y="21" width="8" height="2" rx="1" fill="#182A3E" opacity="0.6"/>
