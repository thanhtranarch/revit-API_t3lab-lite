<rect x="4" y="54" width="56" height="8" rx="5" fill="white"/>
<rect x="4" y="54" width="56" height="4" fill="white"/>
<rect x="8" y="57" width="12" height="2" rx="1" fill="#CBD5E1"/>
<rect x="31" y="57" width="8" height="2" rx="1" fill="#CBD5E1"/>
