title: "ManaPara"
tooltip: Parameter Manager — Transfer values, text-to-element, and values-to-region tools.
description: |
  Unified parameter manager with 3 tools:
  - Parameter Transfer: copy parameter values between elements by rule
  - Text to Element: assign Text Note content to element parameters via spatial overlap
  - Values to Region: write schedule values into filled region parameters
  Supports loading IFC-SG parameter definitions from Autodesk XML or Excel.

author: Dang Quoc Truong
