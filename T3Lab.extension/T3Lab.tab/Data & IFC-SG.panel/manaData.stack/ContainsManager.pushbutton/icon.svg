<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Outer container (building/level) -->
<rect x="2" y="2" width="60" height="60" rx="6" fill="none" stroke="#1E2A3A" stroke-width="3"/>
<rect x="2" y="2" width="60" height="60" rx="6" fill="#1E2A3A" opacity="0.06"/>
<!-- Level label top-left -->
<rect x="4" y="4" width="18" height="7" rx="3" fill="#1E2A3A"/>
<rect x="6" y="6" width="12" height="3" rx="1.5" fill="#5A7290"/>
<!-- Middle container (room/space) -->
<rect x="10" y="14" width="44" height="38" rx="5" fill="none" stroke="#334155" stroke-width="2.5"/>
<rect x="10" y="14" width="44" height="38" rx="5" fill="#253344" opacity="0.3"/>
<!-- Room label -->
<rect x="12" y="16" width="16" height="6" rx="2.5" fill="#334155"/>
<rect x="14" y="18" width="10" height="2" rx="1" fill="#5A7290"/>
<!-- Inner container (element) — orange -->
<rect x="18" y="24" width="28" height="22" rx="4" fill="#C2440C"/>
<!-- Element label -->
<rect x="20" y="26" width="14" height="5" rx="2" fill="#A83300" opacity="0.5"/>
<rect x="22" y="28" width="8" height="2" rx="1" fill="white" opacity="0.7"/>
<!-- Element content lines -->
<rect x="20" y="34" width="22" height="2" rx="1" fill="white" opacity="0.5"/>
<rect x="20" y="39" width="16" height="2" rx="1" fill="white" opacity="0.4"/>
</svg>
