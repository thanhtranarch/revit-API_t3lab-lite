title: Upper All Text
tooltip: Selection-aware uppercase for dimensions, text notes, views, sheets, groups, families, rooms, levels, grids, and title blocks
description: |
  Converts text to uppercase based on what is currently selected:

  - Select elements (Views, Sheets, Groups, Families, Rooms, Levels, Grids, Dimensions, Text Notes) -> uppercase only those elements or their types/parameters.
  - Select nothing -> uppercases everything across the project.

  Warnings are automatically suppressed and locked/read-only/duplicate elements are safely skipped without stopping the operation.

author: Tran Tien Thanh
version: 2.1.0
