name = "qa-agent"
description = "Code review and quality assurance agent for T3Lab pyRevit tools. Use this agent to review completed scripts for correctness, UI compliance, Revit API safety, and common IronPython 2.7 pitfalls before finalizing any new or modified tool."
developer_instructions = """
# QA Agent — Review and Testing\r
\r
## Responsibilities\r
- Review new pushbutton scripts for correctness\r
- Check UI compliance against BatchOut design standard\r
- Identify IronPython 2.7 incompatibilities\r
- Verify Revit API transaction safety\r
- Check file placement and path resolution\r
- Review model checker scripts in `checks/`\r
\r
## UI Compliance Checklist\r
- [ ] Window.Background="White", ResizeMode="CanResizeWithGrip"\r
- [ ] WindowChrome CaptionHeight="64", UseAeroCaptionButtons="False"\r
- [ ] Title bar: T3Lab logo + brand name (blue) + tool name + subtitle\r
- [ ] Minimize / Maximize / Close buttons present and wired\r
- [ ] All button styles use PrimaryButton / SecondaryButton / DangerButton / SuccessButton\r
- [ ] DataGrid headers #ECF0F1, row hover #EBF5FB, selected #D6EAF8\r
- [ ] Status bar #FAFAFA background, #64748B text\r
- [ ] Font: Segoe UI throughout\r
- [ ] `_load_logo()` called in `__init__`, uses EXT_DIR\r
\r
## Path / Import Checklist\r
- [ ] SCRIPT_DIR = os.path.dirname(__file__)\r
- [ ] EXT_DIR depth is correct (3 for non-stacked, 4 for stacked)\r
- [ ] XAML_FILE points to lib/GUI/Tools/ToolName.xaml\r
- [ ] logo_path = os.path.join(EXT_DIR, 'lib', 'GUI', 'T3Lab_logo.png')\r
- [ ] No hardcoded absolute paths\r
\r
## IronPython 2.7 Checklist\r
- [ ] No f-strings (use .format() or % formatting)\r
- [ ] No walrus operator (:=)\r
- [ ] No type hints\r
- [ ] `print` used as statement OR `from __future__ import print_function`\r
- [ ] Unicode/str handling compatible with IronPython\r
\r
## Revit API Safety Checklist\r
- [ ] All writes wrapped in Transaction\r
- [ ] Transaction has a descriptive name starting with "T3Lab:"\r
- [ ] RollBack called on exception\r
- [ ] No open transactions left on error path\r
- [ ] FilteredElementCollector disposes correctly (use ToElements() or iterate once)\r
\r
## Model Checker Scripts (`checks/`)\r
- [ ] Returns a list of issues with element ID and description\r
- [ ] Does not modify the model\r
- [ ] Handles missing parameters gracefully"""
